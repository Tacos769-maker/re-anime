name: Build Unsigned IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cordova
        run: |
          npm install -g cordova
          mkdir -p www
          touch www/index.html

      - name: Prepare iOS Project
        run: |
          cordova platform add ios@7.1.1

      - name: Build Unsigned App
        run: |
          cd platforms/ios
          xcodebuild -workspace *.xcworkspace \
                     -scheme "My Web App" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     clean build

      - name: Package into IPA Payload
        run: |
          mkdir -p Payload
          cp -R platforms/ios/build/device/*.app Payload/ 2>/dev/null || cp -R platforms/ios/build/Outputs/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
          zip -r MyWebApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: MyWebApp.ipa
